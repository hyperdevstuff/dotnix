# dotnix - matugen configuration
# Generates per-app color files from the current wallpaper.
# Run by `wp` (explicit) or `wp-boot` (at niri startup). Apps pick the
# generated files up via their `include` directives.
# Templates live in dotfiles/matugen/templates/ (adapted from matugen-themes,
# https://github.com/InioX/matugen-themes, GPL-2.0).

[config]
version_check = false
# Warm manga/sepia anchor: when the image yields no strong color, fall back
# to a gruvbox gold rather than a random hue.
fallback_color = "#fabd2f"
prefer = "closest-to-fallback"
caching = false

# We set the wallpaper ourselves via awww in `wp` / `wp-boot`; matugen only
# generates colors.
[config.wallpaper]
set = false
# Required by the schema even with set=false; `wp`/`wp-boot` call awww themselves.
command = "true"

[templates.kitty]
input_path = "./templates/kitty.conf"
output_path = "/home/hyper/.config/matugen/generated/kitty-colors.conf"
post_hook = 'pkill -SIGUSR1 kitty || true'

[templates.foot]
input_path = "./templates/foot-colors.ini"
output_path = "/home/hyper/.config/matugen/generated/foot-colors.ini"
post_hook = 'pkill -SIGUSR1 foot || true'

[templates.fuzzel]
input_path = "./templates/fuzzel-colors.ini"
output_path = "/home/hyper/.config/matugen/generated/fuzzel-colors.ini"

# Niri has no variables, so the whole palette block is generated and pulled
# in with `include` from dotfiles/niri/config.kdl. Reload so the change is
# applied without waiting for the config watcher.
[templates.niri]
input_path = "./templates/niri-colors.kdl"
output_path = "/home/hyper/.config/niri/generated/colors.kdl"
post_hook = 'niri msg action load-config-file || true'

# Dolphin (the only KDE app). Writing kdeglobals directly, rather than a
# .colors file selected by name, is what makes the item view pick up the same
# palette as the window chrome outside a Plasma session.
[templates.kde]
input_path = "./templates/kdeglobals"
output_path = "/home/hyper/.config/kdeglobals"

# Zen Browser. Firefox has no include path for chrome styles: the files must
# live in <profile>/chrome/ and only load when
# toolkit.legacyUserProfileCustomizations.stylesheets is on. `wp` copies these
# into every profile, so the profile directory can keep its random prefix.
[templates.zen-userchrome]
input_path = "./templates/zen-userchrome.css"
output_path = "/home/hyper/.config/matugen/generated/zen-userChrome.css"

[templates.zen-usercontent]
input_path = "./templates/zen-usercontent.css"
output_path = "/home/hyper/.config/matugen/generated/zen-userContent.css"

# btop reads themes from ~/.config/btop/themes; `wp` copies this in and selects
# it, so a machine without btop configured never grows a stray config dir.
[templates.btop]
input_path = "./templates/btop.theme"
output_path = "/home/hyper/.config/matugen/generated/btop.theme"
